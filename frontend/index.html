<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycling Weather - Pogoda na Rower</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        success: '#22c55e',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'pulse-slow': 'pulse 3s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                    },
                },
            },
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .dark .gradient-bg {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .score-excellent { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .score-good { background: linear-gradient(135deg, #84cc16, #65a30d); }
        .score-moderate { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .score-poor { background: linear-gradient(135deg, #f97316, #ea580c); }
        .score-bad { background: linear-gradient(135deg, #ef4444, #dc2626); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors duration-300">
    <!-- Header -->
    <header class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <i data-lucide="bike" class="w-10 h-10"></i>
                    <div>
                        <h1 class="text-2xl font-bold">Cycling Weather</h1>
                        <p class="text-sm opacity-80">Sprawdź pogodę na rower</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button id="locationBtn" class="flex items-center gap-2 px-4 py-2 bg-white/20 rounded-lg hover:bg-white/30 transition">
                        <i data-lucide="map-pin" class="w-5 h-5"></i>
                        <span class="hidden sm:inline">Moja lokalizacja</span>
                    </button>
                    <button id="themeToggle" class="p-2 rounded-lg bg-white/20 hover:bg-white/30 transition">
                        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                        <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Location Info -->
        <div id="locationInfo" class="mb-6 text-center text-gray-600 dark:text-gray-400 animate-fade-in">
            <p class="text-lg">Ładowanie lokalizacji...</p>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden">
            <div class="flex flex-col items-center justify-center py-20">
                <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-primary"></div>
                <p class="mt-4 text-gray-600 dark:text-gray-400">Pobieranie prognozy pogody...</p>
            </div>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden">
            <div class="bg-red-100 dark:bg-red-900/30 border border-red-400 dark:border-red-600 text-red-700 dark:text-red-400 px-6 py-4 rounded-lg text-center">
                <i data-lucide="alert-circle" class="w-8 h-8 mx-auto mb-2"></i>
                <p id="errorMessage">Wystąpił błąd podczas pobierania danych.</p>
                <button id="retryBtn" class="mt-3 px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition">
                    Spróbuj ponownie
                </button>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="hidden">
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-6 text-center">
                Prognoza na 7 dni
            </h2>
            <div id="daysGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-4">
                <!-- Day cards will be inserted here -->
            </div>
        </div>
    </main>

    <!-- Day Details Modal -->
    <div id="detailsModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-md w-full animate-slide-up">
            <div id="modalContent">
                <!-- Modal content will be inserted here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
